name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.tool }}, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        # Install one tool per job; with both installed, init() always picks xclip and xsel goes untested.
        tool: [xsel, xclip]
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          # No go.sum to key the cache on.
          cache: false
      - name: Install ${{ matrix.tool }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ${{ matrix.tool }}
      - name: Start Xvfb
        run: |
          Xvfb "$DISPLAY" -screen 0 1024x768x24 &
          sleep 1
      - run: go test -v ./...

  macos-windows:
    name: ${{ matrix.os }} (go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -v ./...

  cross-build:
    name: build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [freebsd, netbsd, openbsd, dragonfly, solaris, plan9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
